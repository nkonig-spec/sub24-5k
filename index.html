<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2356A8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sub-24">
<title>Sub-24 5K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#0F1B2D; --muted:#56637A;
  --line:#D6DDE6; --track:#2356A8; --track-deep:#183F80; --lane:#FFFFFF; --finish:#F2B705;
  --finish-ink:#2B2100; --good:#1F8A5B; --warn:#C2410C; --infield:#E3EAF3;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1320; --surface:#131E30; --surface-2:#18253A; --ink:#E6ECF4; --muted:#93A1B6;
    --line:#26354D; --track:#3F78D0; --track-deep:#2B5FB0; --lane:#DCE7F7; --finish:#F5C542;
    --finish-ink:#231B00; --good:#3FBF86; --warn:#F08A4B; --infield:#16233A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1320; --surface:#131E30; --surface-2:#18253A; --ink:#E6ECF4; --muted:#93A1B6;
  --line:#26354D; --track:#3F78D0; --track-deep:#2B5FB0; --lane:#DCE7F7; --finish:#F5C542;
  --finish-ink:#231B00; --good:#3FBF86; --warn:#F08A4B; --infield:#16233A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--finish);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:88px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--finish);outline-offset:2px;border-radius:4px}
.app{max-width:760px;margin:0 auto;padding:16px 16px 24px}
.view[hidden]{display:none}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--display);line-height:1.02;margin:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);margin:0 0 2px}

/* Welcome */
.welcome{background:var(--track);color:#fff;border-radius:18px;padding:24px 22px 26px;position:relative;overflow:hidden;margin-bottom:14px}
.welcome::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 34px,rgba(255,255,255,.13) 34px 35.5px);pointer-events:none}
.welcome>*{position:relative;z-index:1}
.welcome .date{margin:0 0 6px;opacity:.85;font-weight:500}
.welcome h1{font-weight:800;font-size:clamp(46px,12vw,76px);letter-spacing:-.01em}
.welcome .lead{margin:10px 0 0;font-size:17px;opacity:.95;max-width:46ch}
.welcome .goal{display:inline-block;margin-top:14px;background:var(--finish);color:var(--finish-ink);font-family:var(--display);font-weight:700;font-size:17px;padding:5px 12px;border-radius:6px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.card h2{font-weight:800;font-size:32px}
.card .sub{margin:4px 0 0;color:var(--muted)}
.ask-q{font-weight:700;font-size:24px;margin:20px 0 12px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px 6px;font-family:var(--display);font-weight:700;font-size:22px;cursor:pointer;line-height:1}
.chip small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
.chip:hover{border-color:var(--track)}
.chip[aria-pressed="true"]{background:var(--track);border-color:var(--track);color:#fff}
.chip[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.fit{margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;display:grid;gap:12px}
.fit p{margin:0}
.fit.warn .headline{color:var(--warn)}
.headline{font-weight:600;font-size:17px}
.abs-mini{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.abs-mini h2{font-size:26px}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}

/* Buttons */
.btn{appearance:none;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn-finish{background:var(--finish);color:var(--finish-ink)}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{background:var(--surface-2)}
.btn-danger{background:transparent;border:1.5px solid var(--warn);color:var(--warn)}
.btn-danger[data-arm]{background:var(--warn);color:#fff}
.btn-wide{width:100%;font-size:20px;padding:16px}
.badge{display:inline-block;font-family:var(--body);font-weight:600;font-size:14px;padding:4px 12px;border-radius:999px;vertical-align:middle}
.badge.ok{background:var(--good);color:#fff}
.badge.miss{border:1.5px solid var(--warn);color:var(--warn)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.mark{font-family:var(--display);font-weight:700;font-size:18px}
td small{display:block;color:var(--muted);font-size:12px}
tr.chg td:nth-child(2){color:var(--track);font-weight:700}
.kind{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px}
.k-walk{background:var(--line)} .k-easy{background:#6FA0E8} .k-jog{background:#9DBDEB} .k-tempo{background:var(--track)}
.k-fast{background:var(--finish)} .k-rec{background:#C9D6E6} .k-stride{background:#F7D774} .k-test{background:var(--warn)} .k-race{background:var(--warn)}

/* Plan */
.page-h{margin:6px 0 14px}
.page-h h1{font-weight:800;font-size:44px}
.page-h p{margin:4px 0 0}
.weeks{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.wk{flex:0 0 auto;min-width:58px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer}
.wk b{display:block;font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.wk small{color:var(--muted);font-size:12px}
.wk[aria-pressed="true"]{background:var(--track);border-color:var(--track);color:#fff}
.wk[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.wk.now b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--finish);margin-left:5px;vertical-align:middle}
.wk .dots{display:flex;gap:3px;margin-top:6px}
.wk .dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line)}
.wk .dots i.on{background:var(--good);border-color:var(--good)}
.wk[aria-pressed="true"] .dots i{border-color:rgba(255,255,255,.6)}
.wk[aria-pressed="true"] .dots i.on{background:#7BE0AE;border-color:#7BE0AE}
.days{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.day{display:grid;grid-template-columns:50px minmax(0,1fr) 26px;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.day:last-child{border-bottom:0}
.day[aria-pressed="true"]{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--track)}
.day .dname{font-family:var(--display);font-weight:700;font-size:18px;line-height:1}
.day .ddate{font-size:12px;color:var(--muted)}
.day .dtitle{font-weight:600;line-height:1.2}
.day .dsub{font-size:13px;color:var(--muted)}
.day.rest .dtitle{color:var(--muted);font-weight:500}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff}
.tick.done{background:var(--good);border-color:var(--good)}
.tick.missed{border-color:var(--warn);color:var(--warn);font-weight:700}
.tick.today{border-color:var(--finish)}
.tick.none{visibility:hidden}
.detail h2{font-weight:800;font-size:34px;margin:2px 0 8px}
.detail .sumtxt{font-weight:600;margin:0 0 10px}
.focus{border-left:4px solid var(--finish);padding:8px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;margin:0 0 14px}
.totals{display:flex;flex-wrap:wrap;gap:22px;margin:0 0 14px}
.totals b{display:block;font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.totals small{color:var(--muted);font-size:13px}
.logbox{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.logbox h3{font-weight:700;font-size:24px;margin-bottom:10px}
.log-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:11px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px}
.field textarea{min-height:60px;resize:vertical}
.field.wide{grid-column:1 / -1}

/* Abs view */
.abs-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* Progress */
.track-svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:6px 0 0}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:32px;line-height:1}
.stat small{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.legend{display:flex;gap:18px;font-size:14px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart-svg{width:100%;height:auto;display:block}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist b{display:block;line-height:1.25}
.hist small{color:var(--muted);font-size:13px}
.hist .acts{display:flex;gap:6px}
.hist .btn{padding:8px 12px;font-size:14px}
.paces{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pace{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.pace b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.pace b em{font-style:normal;font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.pace div{font-size:14px}
.pace small{color:var(--muted);font-size:12px}
.pace.goal{background:var(--finish);color:var(--finish-ink)}
.pace.goal small,.pace.goal b em{color:var(--finish-ink);opacity:.75}
.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:end;color:var(--muted);font-size:14px}
.settings input{padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;border-radius:10px}
.nav a svg{width:24px;height:24px}
.nav a[aria-current="page"]{color:var(--track)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
@media (min-width:861px){ .nav{left:50%;right:auto;transform:translateX(-50%);width:440px;bottom:14px;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(15,27,45,.12)} }

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:520px){
  .log-grid{grid-template-columns:1fr 1fr}
  .card{padding:16px}
  .abs-grid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Abs figures */
.fig{width:100%;height:auto;display:block}
.fig line,.fig polyline{stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .floor{stroke-width:2;opacity:.3}
.fig .far{opacity:.4}
.fig .head{fill:currentColor;stroke:none}
.fig g{transform-box:view-box}
@keyframes pl-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes db-arm{0%,12%,88%,100%{transform:rotate(0)}38%,62%{transform:rotate(-78deg)}}
@keyframes db-thigh{0%,12%,88%,100%{transform:rotate(0)}38%,62%{transform:rotate(66deg)}}
@keyframes db-shin{0%,12%,88%,100%{transform:rotate(0)}38%,62%{transform:rotate(-90deg)}}
@keyframes bc-thigh{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(40deg)}}
@keyframes bc-shin{0%,100%{transform:rotate(40deg)}50%{transform:rotate(-30deg)}}
@keyframes bc-torso{0%,50%,100%{transform:rotate(7deg)}25%,75%{transform:rotate(0)}}
@keyframes lr-legs{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(-82deg)}}
.abs-card{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px}
.abs-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.abs-card h4{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.abs-card p{margin:2px 0 12px;color:var(--muted)}
.abs-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.abs-ex{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.abs-fig{color:var(--track);max-width:220px}
.abs-ex b{display:block;font-family:var(--display);font-size:19px}
.abs-ex small{color:var(--muted);font-size:13px;line-height:1.35;display:block}
.t-anim{width:min(100%,460px);margin:4px auto 0}
.timer[data-kind="abs"]{--tbg:#0E6464}
.timer[data-kind="absrest"]{--tbg:#3A4860}

/* Timer */
.timer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;gap:14px;--tbg:#0F1B2D;--tink:#FFFFFF;background:var(--tbg);color:var(--tink);padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;transition:background-color .35s}
.timer[hidden],.timer [hidden]{display:none!important}
.timer[data-kind="walk"],.timer[data-kind="rec"]{--tbg:#3A4860}
.timer[data-kind="easy"],.timer[data-kind="jog"]{--tbg:#2356A8}
.timer[data-kind="tempo"]{--tbg:#14346E}
.timer[data-kind="fast"],.timer[data-kind="stride"]{--tbg:#F2B705;--tink:#1E1700}
.timer[data-kind="test"],.timer[data-kind="race"]{--tbg:#B93A0A}
.timer[data-kind="done"]{--tbg:#1D6B47}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:720px;width:100%;margin:0 auto}
.t-title{font-weight:600;opacity:.9;line-height:1.3}
.t-x{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.t-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;max-width:720px;width:100%;margin:0 auto}
.t-step{font-family:var(--display);font-weight:600;font-size:20px;opacity:.85}
.t-label{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1.05;margin:4px 0 8px}
.t-speed{font-family:var(--display);font-weight:800;font-size:clamp(64px,18vw,128px);line-height:.9}
.t-speed small{font-size:.3em;font-weight:600;margin-left:6px;opacity:.85}
.t-clock{font-family:var(--display);font-weight:700;font-size:clamp(56px,16vw,112px);line-height:1;font-variant-numeric:tabular-nums;margin-top:12px}
.t-bar{width:100%;max-width:520px;height:12px;border-radius:6px;background:rgba(255,255,255,.22);overflow:hidden;margin:14px auto 10px}
.timer[data-kind="fast"] .t-bar,.timer[data-kind="stride"] .t-bar{background:rgba(0,0,0,.15)}
.t-bar i{display:block;height:100%;background:currentColor;width:0;border-radius:inherit}
.t-mark{font-size:17px;opacity:.95}
.t-mot{font-family:var(--display);font-weight:800;font-size:clamp(22px,6vw,32px);line-height:1.15;margin-top:14px;padding:8px 16px;border-radius:12px;background:rgba(0,0,0,.22);opacity:0;transform:scale(.92);transition:opacity .25s,transform .25s;min-height:0}
.t-mot.show{opacity:1;transform:scale(1)}
.t-mot:empty{display:none}
.t-opts{flex-wrap:wrap;row-gap:8px}
.nav{grid-template-columns:repeat(5,1fr)}
@media (min-width:861px){ .nav{width:540px} }
.pf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pf-grid .hgt{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wi-row{display:flex;gap:10px;margin-top:12px}
.wi-row input{flex:1;min-width:0;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:18px}
.wlist{list-style:none;margin:0;padding:0}
.wlist li{display:grid;grid-template-columns:minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wlist li:last-child{border-bottom:0}
.wlist input{width:100%;padding:9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:16px}
.wlist .acts{display:flex;gap:6px}
.wlist .btn{padding:8px 10px;font-size:14px}
.wlist small{display:block;color:var(--muted);font-size:12px}
.t-track{width:min(100%,380px);margin:0 auto}
.t-track svg{width:100%;height:auto;display:block}
.t-sync{text-align:center;margin-bottom:6px}
.t-link{appearance:none;background:none;border:0;color:inherit;opacity:.8;text-decoration:underline;font-size:14px;cursor:pointer;padding:4px 6px}
.t-syncrow{display:flex;gap:8px;justify-content:center;margin-top:6px}
.t-syncrow input{width:160px;padding:9px 10px;border-radius:8px;border:0;font-size:16px;color:#0F1B2D;background:#fff}
.t-syncrow button{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.timer:not([data-kind="abs"]):not([data-kind="absrest"]) .t-speed{font-size:clamp(50px,13vw,100px)}
.timer:not([data-kind="abs"]):not([data-kind="absrest"]) .t-clock{font-size:clamp(46px,12vw,92px);margin-top:6px}
.timer:not([data-kind="abs"]):not([data-kind="absrest"]) .t-label{font-size:clamp(26px,6vw,44px)}
.toast{z-index:60}
.t-next{max-width:720px;width:100%;margin:0 auto;background:rgba(0,0,0,.18);border-radius:10px;padding:12px 16px;font-size:17px}
.t-next span{font-weight:700;margin-right:6px;opacity:.75}
.t-overall{max-width:720px;width:100%;margin:0 auto}
.t-overall .t-bar{max-width:none;height:6px;margin:0 0 6px}
.t-times{display:flex;justify-content:space-between;font-size:14px;opacity:.85;font-variant-numeric:tabular-nums}
.t-ctrl{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:10px;max-width:720px;width:100%;margin:0 auto}
.t-ctrl button{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:12px;padding:16px 10px;font-weight:700;font-size:18px;cursor:pointer}
.t-ctrl button.t-play{background:var(--tink);color:var(--tbg);border-color:var(--tink);font-size:22px}
.t-ctrl button[disabled]{opacity:.4;cursor:default}
.t-opts{display:flex;gap:20px;justify-content:center;font-size:15px;opacity:.9}
.t-opts input{accent-color:currentColor;width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.t-done{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:520px;width:100%;margin:0 auto;gap:14px}
.t-done h2{font-size:52px;margin:0}
.t-done p{margin:0;font-size:17px;opacity:.9}
.t-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t-fields label{font-size:14px;opacity:.9}
.t-fields input{display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:0;font-size:20px;color:#0F1B2D;background:#fff}
.t-feel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t-feel button{appearance:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:10px;padding:12px 4px;font-weight:600;cursor:pointer}
.t-feel button[aria-pressed="true"]{background:#fff;color:#1D6B47;border-color:#fff}
.t-done .t-ctrl{grid-template-columns:2fr 1fr}
.btn-big{font-size:18px;padding:14px 22px}

.upd{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;appearance:none;border:0;background:var(--finish);color:var(--finish-ink);font-weight:700;padding:12px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
</style>
</head>
<body>
<main class="app">
  <section class="view" id="view-today" aria-label="Today"></section>
  <section class="view" id="view-plan" aria-label="Plan" hidden></section>
  <section class="view" id="view-abs" aria-label="Abs" hidden></section>
  <section class="view" id="view-progress" aria-label="Progress" hidden></section>
  <section class="view" id="view-me" aria-label="Me" hidden></section>
</main>
<nav class="nav" aria-label="Sections">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>Today</span></a>
  <a href="#plan" data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span>Plan</span></a>
  <a href="#abs" data-v="abs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M5 21l4-6h6l4 6M9 15l3-7 3 7"/></svg><span>Abs</span></a>
  <a href="#progress" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Progress</span></a>
  <a href="#me" data-v="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>Me</span></a>
</nav>
<div class="timer" id="timer" hidden role="dialog" aria-modal="true" aria-label="Workout timer">
  <div class="t-top"><div class="t-title" id="tTitle"></div><button class="t-x" id="tEnd">End</button></div>
  <div class="t-main" id="tMain">
    <div class="t-track" id="tTrack" hidden></div>
    <div class="t-sync" id="tSyncWrap" hidden><button class="t-link" id="tSyncBtn">Treadmill shows a different distance?</button><div class="t-syncrow" id="tSyncRow" hidden><input id="tSyncVal" inputmode="decimal" placeholder="Miles on treadmill" aria-label="Miles on treadmill"><button id="tSyncSet">Match</button></div></div>
    <div class="t-step" id="tStep"></div>
    <div class="t-label" id="tLabel"></div>
    <div class="t-anim" id="tAnim" hidden></div>
    <div class="t-speed" id="tSpeedWrap"><span id="tMph"></span><small>mph</small></div>
    <div class="t-clock" id="tClock" aria-live="off"></div>
    <div class="t-bar"><i id="tBar"></i></div>
    <div class="t-mark" id="tMark"></div>
    <div class="t-mot" id="tMot" aria-live="polite"></div>
  </div>
  <div class="t-next" id="tNext"></div>
  <div class="t-overall" id="tOverall"><div class="t-bar"><i id="tAll"></i></div><div class="t-times"><span id="tEl"></span><span id="tRem"></span></div></div>
  <div class="t-ctrl" id="tCtrl"><button id="tBack">Back</button><button id="tPlay" class="t-play">Start</button><button id="tSkip">Skip</button></div>
  <div class="t-opts" id="tOpts"><label><input type="checkbox" id="tSound" checked>Beeps</label><label><input type="checkbox" id="tVoice" checked>Voice</label><label><input type="checkbox" id="tCountAll">Count every 10s on long runs</label></div>
  <div class="t-done" id="tDone" hidden>
    <h2 id="tdHead">Workout done</h2>
    <p id="tdSub"></p>
    <div class="t-fields" id="tdFields"><label>Miles<input id="tdMiles" inputmode="decimal"></label><label>Time<input id="tdTime"></label></div>
    <div class="t-feel" id="tdFeel" role="group" aria-label="How it felt"><button aria-pressed="false" data-f="Easy">Easy</button><button aria-pressed="false" data-f="Good">Good</button><button aria-pressed="false" data-f="Hard">Hard</button><button aria-pressed="false" data-f="Too hard">Too hard</button></div>
    <div class="t-ctrl"><button class="t-play" id="tdSave">Save to log</button><button id="tdClose">Close</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- Plan data ---------- */
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYS_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const W = (min,label="Walk") => ({label,kind:"walk",min,mph:3.5});
const R = (min,mph=5.7,label="Easy run") => ({label,kind:"easy",min,mph});
const J = (min,mph=5.5,label="Easy jog (warm-up)") => ({label,kind:"jog",min,mph});
const CD = (min,mph=5.0) => ({label:"Cool-down jog",kind:"jog",min,mph});
const T = (mi,mph) => ({label:`Tempo ${mi} mi`,kind:"tempo",mi,mph});
const F = (mi,mph,label) => ({label,kind:"fast",mi,mph});
const REC = (min) => ({label:`Recovery (${fmtClock(min)})`,kind:"rec",min,mph:4.5});
const STR = (n) => ({label:`${n} strides: 20 sec fast, 40 sec walk`,kind:"stride",min:n,dist:n*((1/3)*7.5+(2/3)*3.5)/60,mphText:"7.5 / 3.5"});
const rep = (n,work,rec,keepLast=false) => { const a=[]; for(let i=0;i<n;i++){a.push({...work,label:`${work.label} (${i+1} of ${n})`}); if(rec && (i<n-1||keepLast)) a.push({...rec});} return a; };
const E = (run,mph=5.7,strides=0) => [W(2,"Warm-up walk"),R(run,mph),...(strides?[STR(strides)]:[]),W(2,"Cool-down walk")];
const PROG = () => [W(2,"Warm-up walk"),R(21),R(5,6.7,"Finish faster (9:00 pace)"),W(2,"Cool-down walk")];

const FOCUS = {
  rw:"Conversational effort the whole way. If you can’t talk in full sentences, slow down or walk more.",
  easy:"Easy means easy. You should finish feeling like you could keep going.",
  strides:"Easy run, then short relaxed pickups. Fast, not all-out; walk fully between them.",
  tempo:"Comfortably hard: you can say a few words, not full sentences. Hold the speed steady.",
  intervals:"Hit the speed on each rep, then recover fully. Your last rep should feel like your first.",
  test:"Checkpoint. Run 2 miles as fast as you can hold. 16:00 or under means sub-24 is on track.",
  prog:"Easy for most of it, then pick it up for the last 5 minutes. Controlled, not a sprint.",
  shake:"Short and light. You’re just loosening up for race day.",
  race:"Run the first mile at 7:45, no faster. Hold on through mile two, then empty the tank.",
  rest:"No running today. A walk is fine, and the 10-minute abs below are a good use of the day."
};

function run(title,type,segs,focus){return {kind:"run",title,type,segs,focus:FOCUS[focus||type]}}
const weekDefs = [
 {sun:run("Run/walk","rw",[W(5),...rep(4,R(4,5.5,"Run"),W(1),true),W(5)]), mon:null,
  wed:run("Run/walk","rw",[W(5),...rep(4,R(4,5.5,"Run"),W(1),true),W(5)]), fri:run("Easy run","easy",[W(5),R(20,5.5),W(5)])},
 {sun:run("Easy run","easy",[W(3),R(18,5.5),W(3)]), mon:run("Easy run","easy",[W(3),R(18,5.5),W(3)]),
  wed:run("Easy run","easy",[W(3),R(23,5.5),W(3)]), fri:run("Easy run","easy",[W(3),R(23,5.5),W(3)])},
 {sun:run("Easy run","easy",E(26,5.5)), mon:run("Easy run + strides","strides",E(22,5.5,4)),
  wed:run("Easy run","easy",E(26,5.5)), fri:run("Easy run + strides","strides",E(22,5.5,4))},
 {sun:run("Easy run","easy",E(26)), mon:run("Easy run + strides","strides",E(20,5.7,6)),
  wed:run("First tempo","tempo",[W(2,"Warm-up walk"),J(8),T(1,6.9),J(9,5.5,"Easy jog"),W(2,"Cool-down walk")]), fri:run("Easy run + strides","strides",E(22,5.7,4))},
 {sun:run("Easy run","easy",E(26)), mon:run("6 × 400m","intervals",[W(2,"Warm-up walk"),J(6),...rep(6,F(.25,7.8,"400m"),REC(1.5)),CD(2),W(1,"Cool-down walk")]),
  wed:run("Tempo","tempo",[W(2,"Warm-up walk"),J(8),T(1.5,6.9),J(5,5.5,"Easy jog"),W(2,"Cool-down walk")]), fri:run("Easy run + strides","strides",E(22,5.7,4))},
 {sun:run("Easy run","easy",E(26)), mon:run("8 × 400m","intervals",[W(1,"Warm-up walk"),J(5),...rep(8,F(.25,7.9,"400m"),REC(1)),W(2,"Cool-down walk")]),
  wed:run("Tempo","tempo",[W(2,"Warm-up walk"),J(7),T(2,7.0),J(2,5.5,"Easy jog"),W(2,"Cool-down walk")]), fri:run("Easy run + strides","strides",E(22,5.7,4))},
 {sun:run("Easy run","easy",E(22)), mon:run("Easy run","easy",E(24)),
  wed:run("2-mile time trial","test",[W(2,"Warm-up walk"),J(8),{label:"Time trial: 2 miles all-out",kind:"test",mi:2,mph:7.5},W(4,"Cool-down walk")]), fri:run("Easy run","easy",E(22))},
 {sun:run("Easy + fast finish","prog",PROG()), mon:run("4 × 800m","intervals",[W(2,"Warm-up walk"),J(5),...rep(4,F(.5,7.8,"800m"),REC(2)),W(2,"Cool-down walk")]),
  wed:run("Tempo","tempo",[W(2,"Warm-up walk"),J(7),T(2,7.1),J(2,5.5,"Easy jog"),W(2,"Cool-down walk")]), fri:run("Easy run + strides","strides",E(22,5.7,4))},
 {sun:run("Easy + fast finish","prog",PROG()), mon:run("5 × 800m","intervals",[W(1,"Warm-up walk"),J(4),...rep(5,F(.5,7.8,"800m"),REC(1.5)),W(1,"Cool-down walk")]),
  wed:run("Tempo","tempo",[W(2,"Warm-up walk"),J(5),T(2.5,7.2),W(2,"Cool-down walk")]), fri:run("Easy run + strides","strides",E(22,5.7,4))},
 {sun:run("Easy + fast finish","prog",PROG()), mon:run("3 × 1200m","intervals",[W(2,"Warm-up walk"),J(5),...rep(3,F(.75,7.8,"1200m"),REC(2)),W(2,"Cool-down walk")]),
  wed:run("Tempo","tempo",[W(2,"Warm-up walk"),J(5),T(2.5,7.3),W(2,"Cool-down walk")]), fri:run("Easy run + strides","strides",E(22,5.7,4))},
 {sun:run("Easy + fast finish","prog",PROG()), mon:run("2 × mile + 2 × 400m","intervals",[W(1,"Warm-up walk"),J(4),F(1,7.8,"1 mile (1 of 2)"),REC(2),F(1,7.8,"1 mile (2 of 2)"),REC(2),F(.25,8.0,"400m (1 of 2)"),REC(1.5),F(.25,8.0,"400m (2 of 2)"),W(1,"Cool-down walk")]),
  wed:run("Tempo","tempo",[W(2,"Warm-up walk"),J(5),T(2.5,7.4),W(2,"Cool-down walk")]), fri:run("Easy run + strides","strides",E(22,5.7,4))},
 {sun:run("Easy run","easy",E(22)), mon:run("Taper: 4 × 400m","intervals",[W(2,"Warm-up walk"),J(8),...rep(4,F(.25,8.2,"400m"),REC(1.5)),CD(3),W(2,"Cool-down walk")]),
  wed:run("Easy + strides","strides",[W(2,"Warm-up walk"),R(13),STR(4),W(2,"Cool-down walk")]), fri:run("Shakeout","shake",[W(2,"Warm-up walk"),R(10,5.7,"Easy shakeout jog"),W(2,"Cool-down walk")]),
  sat:{kind:"race",title:"Race day",type:"race",focus:FOCUS.race,segs:[W(2,"Warm-up walk"),J(8),{label:"5K race",kind:"race",mi:3.1,mph:7.8},W(5,"Cool-down walk")]}}
];

const PHASES = [[0,2,"Phase 1: build the engine. All easy running, no hard days yet."],[3,6,"Phase 2: add intensity. One interval day and one tempo a week."],[7,11,"Phase 3: sharpen to race pace, then taper into race day."]];

const REST = () => ({kind:"rest",title:"Rest",focus:FOCUS.rest});
const PLAN = weekDefs.map((wd,w)=>{
  const days = [wd.sun, wd.mon||REST(), REST(), wd.wed, REST(), wd.fri, wd.sat||REST()];
  return days.map(d=>{ if(d.segs){ computeSegs(d); d.summary=summarize(d.segs); } return d; });
});

function computeSegs(day){
  let cum=0, t=0;
  day.rows = day.segs.map(s=>{
    const dist = s.dist!=null ? s.dist : (s.mi!=null ? s.mi : s.min*s.mph/60);
    const time = s.mi!=null ? s.mi*60/s.mph : s.min;
    cum+=dist; t+=time;
    return {...s,dist,time,mark:cum};
  });
  day.miles=cum; day.minutes=t;
  const hard = day.rows.find(r=>["tempo","fast","test","race"].includes(r.kind));
  day.key = hard ? `${hard.mph.toFixed(1)} mph` : `${(day.rows.find(r=>r.kind==="easy"||r.kind==="jog")||day.rows[0]).mph.toFixed(1)} mph`;
}

function summarize(segs){
  const repRe=/\((\d+) of (\d+)\)$/;
  const merged=[];
  segs.forEach(s=>{ const p=merged[merged.length-1]; if(p && s.kind==="walk" && p.kind==="walk" && !repRe.test(p.label) && !repRe.test(s.label)) p.min+=s.min; else merged.push({...s}); });
  const num=v=>Number.isInteger(v)?String(v):fmtClock(v);
  const phrase=s=>{
    if(s.kind==="walk") return `walk ${num(s.min)} min at ${s.mph.toFixed(1)} mph`;
    if(s.kind==="easy"||s.kind==="jog") return `run ${num(s.min)} min at ${s.mph.toFixed(1)} mph`;
    if(s.kind==="tempo") return `tempo ${s.mi} mi at ${s.mph.toFixed(1)} mph`;
    if(s.kind==="rec") return `${fmtClock(s.min)} recovery at ${s.mph.toFixed(1)} mph`;
    if(s.kind==="stride") return `${s.min} strides (20 sec at 7.5 mph, 40 sec walk)`;
    if(s.kind==="test") return `2-mile time trial, all-out (7.5 mph or faster)`;
    if(s.kind==="race") return `5K race at 7.8 mph`;
    return s.label;
  };
  const out=[]; let i=0;
  while(i<merged.length){
    const s=merged[i], m=repRe.exec(s.label);
    if(m && m[1]==="1"){
      const n=+m[2], base=s.label.replace(repRe,"").trim();
      const nxt=merged[i+1], rec=(nxt && !repRe.test(nxt.label) && n>1) ? nxt : null;
      let j=i, count=0; while(j<merged.length && count<n){ if(repRe.test(merged[j].label)) count++; j++; }
      const work = s.kind==="fast" ? `${n} × ${base} at ${s.mph.toFixed(1)} mph` : `${n} × ${phrase(s)}`;
      const between = rec ? (rec.kind==="walk" ? ` with ${num(rec.min)} min walk between` : ` with ${fmtClock(rec.min)} jog at ${rec.mph.toFixed(1)} mph between`) : "";
      out.push(work+between); i=j;
      if(merged[i] && rec && merged[i].kind===rec.kind && merged[i].min===rec.min && merged[i].kind==="rec" && merged[i+1] && !repRe.test(merged[i+1].label)) i++;
    } else { out.push(phrase(s)); i++; }
  }
  const txt=out.join(", ");
  return txt.charAt(0).toUpperCase()+txt.slice(1);
}

/* ---------- Helpers ---------- */
function fmtClock(min){ const s=Math.round(min*60); const m=Math.floor(s/60), r=s%60; return r? `${m}:${String(r).padStart(2,"0")}` : `${m}:00`; }
function fmtDur(min){ const s=Math.round(min*60); const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,"0")}`; }
function paceFromMph(mph){ return fmtDur(60/mph); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDate(d,long){ return d.toLocaleDateString("en-US",long?{weekday:"long",month:"long",day:"numeric"}:{month:"short",day:"numeric"}); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function parseTime(str){ if(!str) return null; const p=String(str).trim().split(":").map(Number); if(p.some(isNaN)) return null; if(p.length===1) return p[0]; if(p.length===2) return p[0]+p[1]/60; return p[0]*60+p[1]+p[2]/60; }
const key=(w,d)=>`w${w+1}d${d}`;
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};

/* ---------- State ---------- */
const LS_KEY="sub24-5k-state";
let state = {startDate:"2026-11-15", logs:{}};
try{ const raw=localStorage.getItem(LS_KEY); if(raw) state={...state,...JSON.parse(raw)}; }catch(e){}
let dbRef=null, saveTimer=null, writing=false, pending=false;

function persist(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){}
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(writing){ pending=true; return; }
  writing=true;
  try{ await dbRef.set({startDate:state.startDate,logs:state.logs,profile:state.profile||{},weights:state.weights||{}}); setSync("Synced to your account"); }
  catch(e){ setSync("Saved on this device only"); }
  writing=false;
  if(pending){ pending=false; flush(); }
}
var syncText="Saved on this device"; function setSync(t){ syncText=t; const e=document.getElementById("syncNote"); if(e) e.textContent=t; }

(async()=>{
  try{
    if(!window.claude || !window.claude.use) { setSync("Saved on this device"); return; }
    const [db,user] = await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db || !user){ setSync("Saved on this device"); return; }
    const id = await user.id();
    if(!id){ setSync("Saved on this device"); return; }
    dbRef = db.doc(`data/users/${id}/sub24`);
    const snap = await dbRef.get();
    if(snap.exists){ const d=snap.data(); state={...state,...d,logs:{...state.logs,...(d.logs||{})}}; renderAll(); }
    setSync("Synced to your account");
  }catch(e){ setSync("Saved on this device"); }
})();

/* ---------- Derived ---------- */
function start(){ return parseISO(state.startDate); }
function dayDate(w,d){ return addDays(start(),w*7+d); }
function raceDate(){ return dayDate(11,6); }
function todayIdx(){ const diff=Math.round((today0()-start())/86400000); return diff; }
function todayWD(){ const i=todayIdx(); if(i<0) return {w:0,d:0,before:true}; if(i>83) return {w:11,d:6,after:true}; return {w:Math.floor(i/7),d:i%7}; }
const RUNS=[]; PLAN.forEach((wk,w)=>wk.forEach((d,i)=>{ if(d.kind==="run"||d.kind==="race") RUNS.push([w,i]); }));
function loggedMiles(w,d){ const l=state.logs[key(w,d)]; if(!l||!l.done) return 0; const m=parseFloat(l.miles); return isNaN(m)? (PLAN[w][d].miles||0) : m; }
function projected(){
  const tt=state.logs[key(6,3)];
  const t=tt && tt.done ? parseTime(tt.time) : null;
  if(t && t>8 && t<30) return {min:t*Math.pow(3.107/2,1.06),src:"from your 2-mile time trial"};
  return {min:7.8333*Math.pow(3.107,1.06),src:"estimate from your 7:50 mile"};
}

/* ---------- Render: track ---------- */
function stadium(r){ return `M150,${150-r} H450 A${r},${r} 0 0 1 450,${150+r} H150 A${r},${r} 0 0 1 150,${150-r} Z`; }
function renderTrack(){
  const done = RUNS.filter(([w,d])=>state.logs[key(w,d)]?.done).length;
  const frac = done/RUNS.length;
  const t = todayWD();
  const wkLabel = t.before ? "Starts " + fmtDate(start()) : (t.after ? "Plan complete" : `Week ${t.w+1} of 12`);

function segTime(s){ return s.mi!=null ? s.mi*60/s.mph : s.min; }
function adaptRun(day,avail){
  let segs=day.segs.map(s=>({...s}));
  const T=()=>segs.reduce((a,s)=>a+segTime(s),0), over=()=>T()-avail;
  const orig=T();
  if(orig<=avail+0.3) return null;
  const repRe=/\((\d+) of (\d+)\)$/;
  const isKey=s=>["tempo","fast","rec","test","race","stride"].includes(s.kind)||repRe.test(s.label);
  const fk=segs.findIndex(isKey); let lk=-1; segs.forEach((s,i)=>{ if(isKey(s)) lk=i; });
  const idx=s=>segs.indexOf(s);
  const isCool=s=>s.min!=null&&(lk>=0?idx(s)>lk:(idx(s)===segs.length-1&&s.kind==="walk"));
  const isWarmWalk=s=>idx(s)===0&&s.kind==="walk";
  const isWarmJog=s=>s.kind==="jog"&&/warm-up/.test(s.label);
  const isMidJog=s=>s.kind==="jog"&&!/warm-up/.test(s.label)&&lk>=0&&idx(s)>fk&&idx(s)<=lk+1&&!isCool(s);
  const isEasy=s=>s.kind==="easy"&&!repRe.test(s.label);
  segs.forEach(s=>s._o=s.min);
  const trim=(pred,m)=>segs.filter(pred).forEach(s=>{ const o=over(); if(o<=0||s.min==null) return; s.min=Math.max(m,Math.floor(s.min-o)); });
  const easyBefore=segs.filter(isEasy).reduce((a,s)=>a+s.min,0);
  trim(isCool,1); trim(isWarmWalk,1); trim(isMidJog,0); trim(isEasy,8); trim(isWarmJog,4);
  let stridesDropped=false;
  if(over()>0&&segs.some(s=>s.kind==="stride")){ segs=segs.filter(s=>s.kind!=="stride"); stridesDropped=true; }
  const repCount=()=>segs.filter(s=>repRe.test(s.label)).length, origReps=repCount();
  while(over()>0&&repCount()>2){
    let li=-1; segs.forEach((s,i)=>{ if(repRe.test(s.label)) li=i; });
    const prev=segs[li-1], dropPrev=prev&&!repRe.test(prev.label)&&(prev.kind==="rec"||(prev.kind==="walk"&&li-1>0));
    segs.splice(dropPrev?li-1:li, dropPrev?2:1);
  }
  const groups={}; segs.forEach(s=>{ if(repRe.test(s.label)){ const b=s.label.replace(repRe,"").trim(); (groups[b]=groups[b]||[]).push(s); } });
  Object.entries(groups).forEach(([b,arr])=>arr.forEach((s,i)=>s.label=`${b} (${i+1} of ${arr.length})`));
  let tempoFrom=null, tempoTo=null;
  segs.filter(s=>s.kind==="tempo").forEach(s=>{ tempoFrom=s.mi; while(over()>0.2&&s.mi>1){ s.mi=+(s.mi-0.25).toFixed(2); s.label=`Tempo ${s.mi} mi`; } tempoTo=s.mi; });
  trim(isWarmJog,2); trim(isEasy,4);
  lk=-1; segs.forEach((s,i)=>{ if(isKey(s)) lk=i; });
  [isWarmJog,isCool,isWarmWalk,isEasy].forEach(p=>segs.filter(p).forEach(s=>{ const sl=Math.floor(-over()); if(sl>=1&&s._o!=null&&s.min<s._o) s.min=Math.min(s._o,s.min+sl); }));
  segs=segs.filter(s=>s.mi!=null||s.min>0.01);
  const nd={kind:"run",title:day.title,type:day.type,focus:day.focus,segs}; computeSegs(nd); nd.summary=summarize(segs);
  const parts=[], newReps=repCount();
  if(newReps<origReps) parts.push(`${newReps} reps instead of ${origReps}`);
  if(tempoFrom!=null&&tempoTo<tempoFrom) parts.push(`${tempoTo} mile${tempoTo===1?"":"s"} of tempo instead of ${tempoFrom}`);
  const easyAfter=segs.filter(isEasy).reduce((a,s)=>a+s.min,0);
  if(easyAfter<easyBefore-0.5) parts.push(`a ${Math.round(easyAfter)}-minute easy run instead of ${Math.round(easyBefore)}`);
  if(stridesDropped) parts.push("no strides");
  let note=`Shortened from ${Math.round(orig)} to ${Math.round(nd.minutes)} minutes with a shorter warm-up and cool-down${parts.length?", "+parts.join(", "):""}.`;
  if(nd.minutes>avail+0.5) note+=` That’s as short as this workout goes without losing the point of it.`;
  return {day:nd,note};
}

  if(TM.mode==="abs"){ if(s.kind==="abs"&&rem===10) say(TM.idx+":p10",pick(MOT.abs10)); return; }
  if((hard||s.kind==="easy")&&s.sec>=90&&rem===30) say(TM.idx+":p30",pick(MOT.p30));
  if(hard&&s.sec>=40&&rem===10) say(TM.idx+":p10",pick(MOT.p10));
  let doneSec=0; for(let i=1;i<TM.idx;i++) doneSec+=TM.steps[i].sec; doneSec+=el;
  if(doneSec>=TM.totalPlanned/2&&rem>14&&s.sec-el>14) say("half",pick(MOT.half));

function announce(s){ beep(1320,.35); try{ navigator.vibrate&&navigator.vibrate([200,80,200]); }catch(e){} const extra=s.ready?"":stepLine(s); speak(spoken(s)+(extra?" "+extra:"")); if(extra){ if(!TM.said) TM.said=new Set(); TM.said.add(TM.idx+":start"); showMot(extra); } }
async function requestWake(){ try{ if(navigator.wakeLock) TM.wake=await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ TM.wake&&TM.wake.release(); }catch(e){} TM.wake=null; }

function openTimer(w,d,ov,thenAbs){
  const day=ov||PLAN[w][d]; if(!day.segs) return;
  const steps=timerSteps(day);

  Object.assign(TM,{mode:"run",offset:0,said:new Set(),thenAbs:thenAbs||0,w,d,day,steps,idx:0,acc:0,startedAt:0,running:false,started:false,finished:false,lastBeep:-1,total:0,lastTick:0,endArm:false,feel:""});
  TM.totalPlanned=steps.reduce((a,s)=>a+(s.ready?0:s.sec),0);
  $("tTitle").textContent=`Week ${w+1}, ${DAYS_LONG[d]}: ${day.title}`;
  ["tMain","tNext","tOverall","tCtrl","tOpts"].forEach(id=>$(id).hidden=false); $("tDone").hidden=true;

function renderTimer(){

  const n=TM.steps[TM.idx+1];
  $("tNext").innerHTML=n?(isAbs?`<span>Next</span>${esc(n.label)} for ${clock(n.sec)}`:`<span>Next</span>${esc(n.label)} at <b>${n.mph.toFixed(1)} mph</b> for ${clock(n.sec)}`):`<span>Next</span>${isAbs?"Done":"Finish and log it"}`;
  let doneSec=0; for(let i=1;i<TM.idx;i++) doneSec+=TM.steps[i].sec; if(!s.ready) doneSec+=el;

function tick(){
  if(!TM.running||TM.finished) return;
  const now=performance.now();
  if(!TM.steps[TM.idx].ready) TM.total+=(now-TM.lastTick)/1000;
  TM.lastTick=now;
  let el=TM.acc+(now-TM.startedAt)/1000, s=TM.steps[TM.idx];
  while(el>=s.sec){
    const over=el-s.sec;
    if(TM.idx>=TM.steps.length-1){ finishTimer(false); return; }
    TM.idx++; TM.acc=over; TM.startedAt=now; TM.lastBeep=-1; s=TM.steps[TM.idx]; el=over; announce(s);
  }
  const rem=Math.ceil(s.sec-el);
  motivate(s,el,rem);
  countOut(s,el,rem);
  if(rem<=3&&rem>=1&&TM.lastBeep!==rem){ TM.lastBeep=rem; beep(880,.12); }
  renderTimer();
}
function togglePlay(){
  if(TM.finished) return;
  if(!TM.ctx){ try{ TM.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(TM.ctx&&TM.ctx.state==="suspended") TM.ctx.resume();
  const now=performance.now();
  if(TM.running){ TM.acc=stepEl(); TM.running=false; releaseWake(); }
  else { TM.startedAt=now; TM.lastTick=now; TM.running=true; requestWake(); if(!TM.started){ TM.started=true; announce(TM.steps[TM.idx]); } }
  renderTimer();
}
function jumpTo(i){ TM.idx=i; TM.acc=0; TM.startedAt=performance.now(); TM.lastBeep=-1; if(TM.running) announce(TM.steps[i]); renderTimer(); }
function timerBack(){ if(stepEl()>3||TM.idx===0) jumpTo(TM.idx); else jumpTo(TM.idx-1); }
function timerSkip(){ if(TM.idx>=TM.steps.length-1) finishTimer(true); else jumpTo(TM.idx+1); }
function timerEnd(){

}
function finishTimer(early){

  TM.running=false; TM.finished=true; clearInterval(TM.iv); releaseWake();

  $("timer").dataset.kind="done";

/* ---------- Speed fitting: keep the miles, change the speeds ---------- */
function fitSpeeds(day,avail){
  if(avail>=day.minutes-0.3) return {day,mode:avail>day.minutes+2?"extra":"same"};
  let segs=day.segs.map(s=>({...s}));
  const adj=s=>["walk","rec","jog","easy","tempo","fast"].includes(s.kind);
  const dist=s=>s.dist!=null?s.dist:(s.mi!=null?s.mi:s.min*s.mph/60);
  const cap=s=>(s.kind==="tempo"||s.kind==="fast")?s.mph+0.3:({walk:4.0,rec:5.0,jog:6.5,easy:6.5})[s.kind];
  const spd=(s,k)=>Math.min(cap(s),Math.max(s.mph,s.mph*k));
  const timeAt=k=>segs.reduce((a,s)=>a+(adj(s)?dist(s)*60/spd(s,k):segTime(s)),0);
  const isRep=s=>/\(\d+ of \d+\)$/.test(s.label);
  let host=null; segs.forEach(s=>{ if((s.kind==="easy"||s.kind==="jog")&&!isRep(s)&&(!host||dist(s)>dist(host))) host=s; });
  const addTo=dd=>{ const d=dist(host)+dd; if(host.mi!=null) host.mi=d; else host.min=d*60/host.mph; };
  let trimmedWalks=false, droppedStrides=false;
  if(timeAt(50)>avail&&host){
    [segs[0],segs[segs.length-1]].forEach(s=>{ if(s&&s.kind==="walk"&&s.min>1){ addTo((s.min-1)*s.mph/60); s.min=1; trimmedWalks=true; } });
    if(timeAt(50)>avail&&segs.some(s=>s.kind==="stride")){ segs.filter(s=>s.kind==="stride").forEach(s=>addTo(dist(s))); segs=segs.filter(s=>s.kind!=="stride"); droppedStrides=true; }
  }
  const minT=timeAt(50);
  if(minT>avail+0.3) return {mode:"cant",minT};
  let lo=1,hi=50; for(let i=0;i<40;i++){ const m=(lo+hi)/2; if(timeAt(m)>avail) lo=m; else hi=m; }
  segs.forEach(s=>{ if(!adj(s)) return; const d=dist(s), v=Math.min(cap(s),Math.ceil(spd(s,hi)*10-1e-6)/10); s.mph=+v.toFixed(1); if(s.mi==null) s.min=d*60/s.mph; });
  const nd={kind:"run",title:day.title,type:day.type,focus:day.focus,segs}; computeSegs(nd); nd.summary=summarize(segs);
  return {day:nd,mode:"faster",trimmedWalks,droppedStrides};
}

function nextRun(){ const t=todayWD(); if(t.after) return null; for(let i=t.before?0:t.w*7+t.d+1;i<84;i++){ const w=Math.floor(i/7),d=i%7; if(PLAN[w][d].segs) return {w,d}; } return null; }
function logLine(lg){ if(!lg) return ""; const p=[]; if(lg.miles) p.push(`${lg.miles} mi`); if(lg.time) p.push(`${p.length?"in ":""}${lg.time}`); let s=p.join(" "); if(lg.feel) s+=`${s?", ":""}felt ${lg.feel.toLowerCase()}`; return s||"Logged"; }
function armDelete(btn,fn){ btn.onclick=()=>{ if(btn.dataset.arm){ fn(); return; } btn.dataset.arm="1"; const o=btn.textContent; btn.textContent="Tap again to delete"; setTimeout(()=>{ if(btn.isConnected&&btn.dataset.arm){ delete btn.dataset.arm; btn.textContent=o; } },3000); }; }

function stepTable(nd,pd){
  const cmp=pd&&nd.rows.length===pd.rows.length;
  return `<div class="tbl-wrap"><table><thead><tr><th>Step</th><th class="num">Speed</th><th class="num">Time</th><th class="num">Mile</th></tr></thead><tbody>${nd.rows.map((r,i)=>{ const p=cmp?pd.rows[i]:null, ch=p&&!r.mphText&&Math.abs(p.mph-r.mph)>0.05; return `<tr${ch?' class="chg"':""}><td><span class="kind k-${r.kind}"></span>${esc(r.label)}</td><td class="num">${r.mphText||r.mph.toFixed(1)}${ch?`<small>was ${p.mph.toFixed(1)}</small>`:""}</td><td class="num">${fmtDur(r.time)}</td><td class="num mark">${r.mark.toFixed(2)}</td></tr>`; }).join("")}</tbody></table></div>`;
}

/* ---------- Live track on the run timer ---------- */
const LAP=0.24855;
function buildTrackSvg(){
  return `<svg viewBox="0 0 600 300" aria-hidden="true">
    <path d="${stadium(114)}" fill="none" stroke="currentColor" stroke-opacity=".16" stroke-width="60"/>
    ${[86,100,114,128,142].map(r=>`<path d="${stadium(r)}" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1.4"/>`).join("")}
    <line x1="150" y1="4" x2="150" y2="68" stroke="currentColor" stroke-opacity=".7" stroke-width="4"/>
    <path id="tProg" d="${stadium(114)}" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" pathLength="1000" stroke-dasharray="0 1000"/>
    <circle id="tDot" cx="150" cy="36" r="15" fill="currentColor" stroke="var(--tbg)" stroke-width="5"/>
    <text id="tMiles" x="300" y="160" text-anchor="middle" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="800" font-size="76" fill="currentColor">0.00</text>
    <text id="tLap" x="300" y="198" text-anchor="middle" font-family="Barlow, sans-serif" font-size="21" fill="currentColor" fill-opacity=".85"></text>
  </svg>`;
}
function liveMiles(s,el){ const prev=TM.idx>0?TM.steps[TM.idx-1].mark:0, cur=s.ready?0:Math.min(el/s.sec,1)*(s.mark-prev); return Math.max(0,prev+cur+(TM.offset||0)); }
function updateTrack(s,el){
  const box=$("tTrack"); if(!box.firstElementChild) box.innerHTML=buildTrackSvg();
  const mi=liveMiles(s,el), frac=(mi%LAP)/LAP, lap=Math.floor(mi/LAP)+1;
  const p=$("tProg"), L=p.getTotalLength(); if(!L) return;
  const pt=p.getPointAtLength(L*frac);
  p.setAttribute("stroke-dasharray",`${(frac*1000).toFixed(1)} 1000`);
  $("tDot").setAttribute("cx",pt.x.toFixed(1)); $("tDot").setAttribute("cy",pt.y.toFixed(1));
  $("tMiles").textContent=mi.toFixed(2);
  $("tLap").textContent=`of ${Math.max(0,TM.day.miles+(TM.offset||0)).toFixed(2)} mi, lap ${lap}`;
  const whole=Math.floor(mi+1e-6);
  if(TM.running&&!s.ready&&whole>=1) say("mile"+whole,`${whole} mile${whole>1?"s":""} done. Keep it going.`);
}
$("tSyncBtn").onclick=()=>{ const r=$("tSyncRow"); r.hidden=!r.hidden; if(!r.hidden) $("tSyncVal").focus(); };
$("tSyncSet").onclick=()=>{

/* ---------- Spoken countdown ---------- */
function countOut(s,el,rem){
  if(s.ready||!$("tVoice").checked||rem<=0||rem>=s.sec||el<4) return;
  if(!TM.said) TM.said=new Set();
  const tag=TM.idx+":c"+rem; if(TM.said.has(tag)) return;
  if(TM.said.has(TM.idx+":p"+rem)&&(rem===30||rem===10)) { TM.said.add(tag); return; }
  let line=null;
  const mmss=r=>{ const m=Math.floor(r/60), x=r%60; return m?`${m} minute${m>1?"s":""}${x?` ${x}`:" left"}`:`${x} seconds`; };
  if(TM.mode==="abs"){ if(rem%10===0) line=`${rem} seconds`; }
  else if(rem%10===0&&(rem<=60||$("tCountAll").checked)) line=mmss(rem);
  else if(rem%60===0) line=mmss(rem);
  if(!line) return;
  TM.said.add(tag); speak(line);
}

      <div class="pf-grid">
        <div class="field"><label for="pfName">Name</label><input id="pfName" value="${esc(pf.name||"Nate")}"></div>
        <div class="field"><label for="pfDob">Date of birth</label><input id="pfDob" type="date" value="${esc(pf.dob||"")}"></div>
        <div class="field"><label for="pfFt">Height</label><div class="hgt"><input id="pfFt" inputmode="numeric" placeholder="ft" aria-label="Feet" value="${esc(pf.heightFt??"")}"><input id="pfIn" inputmode="numeric" placeholder="in" aria-label="Inches" value="${esc(pf.heightIn??"")}"></div></div>
        <div class="field"><label for="pfStart">Starting weight (lb)</label><input id="pfStart" inputmode="decimal" value="${esc(pf.startWeight??"")}"></div>
        <div class="field"><label for="pfGoal">Goal weight (lb, optional)</label><input id="pfGoal" inputmode="decimal" value="${esc(pf.goalWeight??"")}"></div>
      </div>
      <div class="row-btns"><button class="btn btn-finish" id="pfSave">Save profile</button></div>
    </section>
    <section class="card"><h2 style="font-size:26px">Weight by week</h2><p class="sub" style="margin-bottom:10px">Log at the end of each week, on Saturday or Sunday. The Today screen will remind you.</p>${weightChart(pts)}
      <ul class="wlist">${Array.from({length:12},(_,i)=>i+1).map(w=>{ const e=ws["w"+w]; return `<li><div><b>Week ${w}</b><small>Ends ${fmtDate(dayDate(w-1,6),true)}</small></div><input inputmode="decimal" placeholder="lb" aria-label="Week ${w} weight in pounds" id="wv${w}" value="${e?e.lb:""}"><div class="acts"><button class="btn btn-line" data-ws="${w}">${e?"Update":"Save"}</button>${e?`<button class="btn btn-danger" data-wd="${w}">Delete</button>`:""}</div></li>`; }).join("")}</ul>
    </section>`;
  el.insertAdjacentHTML("beforeend",`<section class="card"><h2 style="font-size:26px">Your data</h2><p class="sub" style="margin-bottom:10px">Save a backup of your runs, weigh-ins and profile, or load one into another copy of the app.</p><div class="row-btns" style="margin-top:0"><button class="btn btn-line" id="dExport">Export my data</button><label class="btn btn-line" for="dImport">Import a backup</label><input type="file" id="dImport" accept="application/json,.json" hidden></div></section>`);
  $("dExport").onclick=exportData; $("dImport").onchange=e=>{ importData(e.target.files[0]); e.target.value=""; };
  $("pfSave").onclick=()=>{ const num=id=>{ const v=$(id).value.trim(); return v===""?"":+v; };
    const p={name:$("pfName").value.trim()||"Nate",dob:$("pfDob").value,heightFt:num("pfFt"),heightIn:num("pfIn"),startWeight:num("pfStart"),goalWeight:num("pfGoal")};
    if([p.heightFt,p.heightIn,p.startWeight,p.goalWeight].some(v=>v!==""&&isNaN(v))){ toast("Check the numbers and try again"); return; }
    state.profile=p; persist(); renderAll(); toast("Profile saved"); };
  el.querySelectorAll("[data-ws]").forEach(b=>b.onclick=()=>saveWeight(+b.dataset.ws,$("wv"+b.dataset.ws).value));
  el.querySelectorAll("[data-wd]").forEach(b=>armDelete(b,()=>{ delete state.weights["w"+b.dataset.wd]; persist(); renderAll(); toast("Weigh-in deleted"); }));
}

function renderAll(){ renderTodayView(); renderPlanView(); renderAbsView(); renderProgressView(); renderMeView(); }
renderAll();
showView(location.hash.slice(1));


/* ---------- Installable app: offline support and updates ---------- */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const show=()=>{ if(document.querySelector(".upd")) return; const b=document.createElement("button"); b.className="upd"; b.textContent="Update available. Tap to refresh."; b.onclick=()=>{ if(reg.waiting) reg.waiting.postMessage("skip"); else location.reload(); }; document.body.appendChild(b); };
    if(reg.waiting&&navigator.serviceWorker.controller) show();
    reg.addEventListener("updatefound",()=>{ const nw=reg.installing; if(nw) nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller) show(); }); });
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); });
  }).catch(()=>{});
  let reloading=false; navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(reloading) return; reloading=true; location.reload(); });
}
</script>
</body>
</html>
